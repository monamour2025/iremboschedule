name: Scheduled Scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger Vercel cron tick (scan + automation)
        run: |
          curl -fsS "https://${WEBSITE_URL}/api/cron/tick" \
            -H "Authorization: Bearer ${CRON_SECRET}"
