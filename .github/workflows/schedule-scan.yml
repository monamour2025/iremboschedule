# Scan + match + create codes on GitHub (not Vercel).
# This keeps Hobby Fluid CPU from pausing the site.
#
# Required GitHub secrets:
#   DATABASE_URL, ENCRYPTION_KEY, AUTOMATION_MODE
# Optional SMS/email: RESEND_API_KEY, RESEND_FROM, ALERT_EMAIL

name: Scheduled Scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: scheduled-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      AUTOMATION_MODE: ${{ secrets.AUTOMATION_MODE }}
      AUTOMATION_INLINE: "1"
      AUTOMATION_CONCURRENCY: "6"
      ESTIMATE_MATCH_CONCURRENCY: "8"
      ESTIMATE_BOOK_LIMIT: "24"
      IREMBO_EXPAND_TIME_SLOTS: "false"
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      DEFAULT_IREMBO_ENTITY_ID: ${{ secrets.DEFAULT_IREMBO_ENTITY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check required secrets
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Add GitHub secret DATABASE_URL (same as Vercel)."
            exit 1
          fi
          if [ -z "${ENCRYPTION_KEY:-}" ]; then
            echo "::error::Add GitHub secret ENCRYPTION_KEY (same as Vercel)."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - name: Scan Irembo and create codes
        run: node scripts/runGithubTick.js
