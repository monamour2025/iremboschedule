# Scan + match + create codes on GitHub (not Vercel).
# This keeps Hobby Fluid CPU from pausing the site.
#
# Required GitHub secrets (copy from Vercel / local .env):
#   DATABASE_URL, ENCRYPTION_KEY, AUTOMATION_MODE
# Optional but needed to book: IREMBO_CITIZEN_COOKIE or IREMBO_USERNAME + IREMBO_PASSWORD
# Optional SMS/email: RESEND_API_KEY, RESEND_FROM, ALERT_EMAIL

name: Scheduled Scan

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

concurrency:
  group: scheduled-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      AUTOMATION_MODE: ${{ secrets.AUTOMATION_MODE }}
      AUTOMATION_INLINE: "1"
      IREMBO_EXPAND_TIME_SLOTS: "false"
      IREMBO_CITIZEN_COOKIE: ${{ secrets.IREMBO_CITIZEN_COOKIE }}
      IREMBO_USERNAME: ${{ secrets.IREMBO_USERNAME }}
      IREMBO_PASSWORD: ${{ secrets.IREMBO_PASSWORD }}
      IREMBO_OTP: ${{ secrets.IREMBO_OTP }}
      IREMBO_PLATFORM_TOKEN: ${{ secrets.IREMBO_PLATFORM_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      DEFAULT_IREMBO_ENTITY_ID: ${{ secrets.DEFAULT_IREMBO_ENTITY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check required secrets
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Add GitHub secret DATABASE_URL (same as Vercel)."
            exit 1
          fi
          if [ -z "${ENCRYPTION_KEY:-}" ]; then
            echo "::error::Add GitHub secret ENCRYPTION_KEY (same as Vercel)."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - name: Scan Irembo and create codes
        run: node scripts/runGithubTick.js
